name: Scanner-X
description: >
  Security scan for pull requests: gitleaks (secrets), semgrep (SAST), and npm audit plus
  OSV-Scanner (dependencies in JavaScript, Python, Java, Rust, Go, ...), with optional AI triage. Uploads SARIF to GitHub code scanning and
  fails the job when findings reach the chosen severity.
author: adarshm07
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Directory of the checked-out repository to scan.
    default: "."
  checks:
    description: Comma-separated checks to run (secrets, sast, deps) or "all".
    default: all
  fail-on:
    description: Fail the job when a finding is at or above this severity (critical, high, medium, low).
    default: high
  diff-only:
    description: >
      On pull_request events, only report findings in files the PR changes (secrets are
      checked in every PR commit). Needs actions/checkout with fetch-depth 0.
    default: "true"
  full-history:
    description: Scan every commit for secrets, not just the current files.
    default: "false"
  triage:
    description: >
      Explain findings with an LLM: gemini, claude or openai. Off by default because it sends
      code snippets to the provider. Pass the provider's key via env (e.g. GEMINI_API_KEY).
    default: ""
  sarif-file:
    description: Where to write the SARIF report.
    default: scanner-x.sarif
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning (needs security-events write).
    default: "true"
  gitleaks-version:
    description: gitleaks release to install when gitleaks isn't already on PATH.
    default: "8.21.2"
  semgrep-version:
    description: semgrep version to install when semgrep isn't already on PATH (empty = latest).
    default: ""
  osv-scanner-version:
    description: osv-scanner release to install when it isn't already on PATH (dependencies for Python, Java, Rust, Go, ...).
    default: "2.0.0"

outputs:
  passed:
    description: '"true" when the policy passed.'
    value: ${{ steps.scan.outputs.passed }}
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    # Inputs are passed through env, never interpolated into scripts, so a crafted
    # value can't inject shell commands.
    - name: Install scanners
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        OSV_SCANNER_VERSION: ${{ inputs.osv-scanner-version }}
      run: |
        set -euo pipefail
        if ! command -v gitleaks >/dev/null; then
          [[ "$GITLEAKS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid gitleaks-version"; exit 1; }
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        fi
        if ! command -v osv-scanner >/dev/null; then
          [[ "$OSV_SCANNER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid osv-scanner-version"; exit 1; }
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          grep -qx "$RUNNER_TEMP" <<< "$(cat "$GITHUB_PATH" 2>/dev/null)" || echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        fi
        if ! command -v semgrep >/dev/null; then
          if [ -n "$SEMGREP_VERSION" ]; then
            [[ "$SEMGREP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid semgrep-version"; exit 1; }
            pipx install "semgrep==${SEMGREP_VERSION}"
          else
            pipx install semgrep
          fi
        fi

    - name: Build Scanner-X
      shell: bash
      working-directory: ${{ github.action_path }}/backend
      run: |
        set -euo pipefail
        npm ci --no-audit --no-fund
        npm run build

    - name: Scan
      id: scan
      shell: bash
      env:
        SX_PATH: ${{ inputs.path }}
        SX_CHECKS: ${{ inputs.checks }}
        SX_FAIL_ON: ${{ inputs.fail-on }}
        SX_DIFF_ONLY: ${{ inputs.diff-only }}
        SX_FULL_HISTORY: ${{ inputs.full-history }}
        SX_TRIAGE: ${{ inputs.triage }}
        SX_SARIF: ${{ inputs.sarif-file }}
        SX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        SX_TARGET: ${{ github.repository }}
        SX_CLI: ${{ github.action_path }}/backend/dist/cli.js
      run: |
        set +e
        args=(--path "$SX_PATH" --checks "$SX_CHECKS" --fail-on "$SX_FAIL_ON" --sarif "$SX_SARIF" --json scanner-x.json --target "$SX_TARGET")
        if [ "$SX_DIFF_ONLY" = "true" ] && [ -n "$SX_BASE_SHA" ]; then args+=(--base "$SX_BASE_SHA"); fi
        if [ "$SX_FULL_HISTORY" = "true" ]; then args+=(--full-history); fi
        if [ -n "$SX_TRIAGE" ]; then args+=(--triage "$SX_TRIAGE"); fi
        node "$SX_CLI" "${args[@]}" | tee scanner-x-summary.txt
        code=${PIPESTATUS[0]}
        {
          echo "exit-code=$code"
          echo "passed=$([ "$code" = 0 ] && echo true || echo false)"
          echo "sarif-file=$SX_SARIF"
        } >> "$GITHUB_OUTPUT"
        { echo '### Scanner-X'; echo '```'; cat scanner-x-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - name: Upload SARIF to code scanning
      if: always() && inputs.upload-sarif == 'true' && steps.scan.outputs.exit-code != '2'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: scanner-x

    - name: Enforce policy
      if: steps.scan.outputs.exit-code != '0'
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        if [ "$CODE" = "2" ]; then echo "::error::Scanner-X could not run (see the Scan step)."; else echo "::error::Scanner-X policy failed (see the job summary)."; fi
        exit 1
